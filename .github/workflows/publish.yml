name: تأیید و زمان‌بندی انتشار

on:
  workflow_dispatch:
    inputs:
      action:
        description: "کار مورد نظر"
        type: choice
        default: schedule
        options: [schedule, approve, reject, status]
      ids:
        description: "شناسهٔ موردها با ویرگول (مثلاً w1-reel1,w1-postA) یا all برای همهٔ پیش‌نویس‌ها"
        required: false
        default: ""
  push:
    paths: ["queue/queue.json"]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: silent-talk-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: تأیید یا رد
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'approve' || inputs.action == 'reject') }}
        run: python3 scripts/publish.py "${{ inputs.action }}" "${{ inputs.ids }}"
      - name: خلاصهٔ صف
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'status' }}
        run: python3 scripts/publish.py status
      - name: بررسی بدون ارسال
        if: ${{ env.METRICOOL_TOKEN == '' }}
        run: |
          echo "::notice::توکن Metricool تنظیم نشده؛ فقط بررسی آزمایشی انجام شد."
          python3 scripts/publish.py schedule --dry-run
      - name: زمان‌بندی در Metricool
        if: ${{ env.METRICOOL_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.action == 'schedule' || inputs.action == 'approve') }}
        run: python3 scripts/publish.py schedule
      - name: ثبت تغییر صف
        run: |
          git config user.name "silent-talk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/queue.json
          git diff --cached --quiet || (git commit -m "queue: به‌روزرسانی وضعیت" && git push)
